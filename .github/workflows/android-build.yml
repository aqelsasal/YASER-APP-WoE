name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Extract Project Zip and Total Cleanup
        run: |
          if [ -f "Project.zip" ]; then
            unzip -o Project.zip
          elif [ -f "project.zip" ]; then
            unzip -o project.zip
          fi

          TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          
          cd "$TARGET_DIR"
          rm -rf node_modules package-lock.json yarn.lock bun.lockb dist build .vite

      - name: Clean Install Dependencies
        run: |
          cd ${{ env.TARGET_DIR }}
          npm install --legacy-peer-deps

      - name: Fix Missing Dependencies and Native Bindings
        run: |
          cd ${{ env.TARGET_DIR }}
          npm install react-is @esbuild/linux-x64 @tailwindcss/oxide-linux-x64-gnu --legacy-peer-deps || true

      - name: Build Web App (Patch Existing Workbox Config)
        run: |
          cd ${{ env.TARGET_DIR }}
          
          find . -maxdepth 3 -name "vite.config.*" -exec node -e '
            const fs = require("fs");
            const file = process.argv[1];
            let content = fs.readFileSync(file, "utf8");
            
            if (content.includes("workbox:")) {
              content = content.replace(/workbox:\s*\{/, "workbox: {\n      maximumFileSizeToCacheInBytes: 15000000,");
            } else if (content.includes("VitePWA({")) {
              content = content.replace(/VitePWA\(\{/, "VitePWA({\n    workbox: { maximumFileSizeToCacheInBytes: 15000000 },");
            }
            
            fs.writeFileSync(file, content);
          ' {} \;

          NODE_OPTIONS="--experimental-global-webcrypto" npm run build

      - name: Sync Capacitor Android
        run: |
          cd ${{ env.TARGET_DIR }}
          npx cap copy android || true
          npx cap sync android || true

      - name: Repair Wrapper and Build Debug APK
        run: |
          cd ${{ env.TARGET_DIR }}
          
          ANDROID_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$ANDROID_DIR"
          
          # حذف الملف المعطوب وتوليده مجدداً بواسطة Gradle المثبت في النظام
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.2
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
