name: Build Android APK from Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Extract Project Zip and Total Cleanup
        run: |
          if [ -f "Project.zip" ]; then
            unzip -o Project.zip
          elif [ -f "project.zip" ]; then
            unzip -o project.zip
          fi

          TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          
          cd "$TARGET_DIR"
          rm -rf node_modules package-lock.json yarn.lock bun.lockb dist build .vite

      - name: Clean Install Dependencies
        run: |
          cd ${{ env.TARGET_DIR }}
          npm install --legacy-peer-deps

      - name: Fix Missing Dependencies and Native Bindings
        run: |
          cd ${{ env.TARGET_DIR }}
          npm install react-is @esbuild/linux-x64 @tailwindcss/oxide-linux-x64-gnu --legacy-peer-deps || true

      - name: Build Web App
        run: |
          cd ${{ env.TARGET_DIR }}
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd ${{ env.TARGET_DIR }}
          npx cap copy android || true
          npx cap sync android || true

      - name: Build Debug APK
        run: |
          GRADLE_DIR=$(dirname $(find . -name "gradlew" | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
