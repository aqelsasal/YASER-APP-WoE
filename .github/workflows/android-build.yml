name: Build Android APK from AI Studio Zip

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Extract Project Zip & Full Cleanup
        run: |
          if [ -f "Project.zip" ]; then
            unzip -o Project.zip
          elif [ -f "project.zip" ]; then
            unzip -o project.zip
          fi

          TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          
          cd "$TARGET_DIR"
          rm -rf node_modules package-lock.json yarn.lock bun.lockb dist build .vite android

      - name: Install Project Dependencies
        run: |
          cd ${{ env.TARGET_DIR }}
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Fix Vite Workbox Config & Build Web App
        run: |
          cd ${{ env.TARGET_DIR }}
          
          find . -maxdepth 3 -name "vite.config.*" -exec node -e '
            const fs = require("fs");
            const file = process.argv[1];
            let content = fs.readFileSync(file, "utf8");
            
            if (content.includes("workbox:")) {
              content = content.replace(/workbox:\s*\{/, "workbox: {\n      maximumFileSizeToCacheInBytes: 15000000,");
            } else if (content.includes("VitePWA({")) {
              content = content.replace(/VitePWA\(\{/, "VitePWA({\n    workbox: { maximumFileSizeToCacheInBytes: 15000000 },");
            }
            
            fs.writeFileSync(file, content);
          ' {} \;

          NODE_OPTIONS="--experimental-global-webcrypto" npm run build

      - name: Generate Fresh Android Project & Sync
        run: |
          cd ${{ env.TARGET_DIR }}
          npx cap init "YASER APP" "com.yaser.app" --web-dir dist || true
          npx cap add android
          npx cap sync android

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Clean Build Debug APK
        run: |
          cd ${{ env.TARGET_DIR }}/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel -Dorg.gradle.jvmargs="-Xmx3072m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
